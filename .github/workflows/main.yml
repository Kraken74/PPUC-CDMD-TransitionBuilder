name: Build Windows plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect the plugin folder
        run: cmake --install build --config Release --prefix dist

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: TransitionBuilder-windows-x64
          path: dist

      - name: Build the tests
        run: cmake -S . -B build-tests -A x64 -DTRANSITIONBUILDER_TESTS=ON && cmake --build build-tests --config Release

      - name: Run the tests
        run: ctest --test-dir build-tests -C Release --output-on-failure
