name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: -A x64
          - name: windows-x86
            os: windows-latest
            args: -A Win32
          # The older Ubuntu keeps the plugin usable on older distributions.
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            args: ""
          - name: macos-arm64
            os: macos-14
            args: ""
    steps:
      - uses: actions/checkout@v4

      # The version is in src/Version.h (1.01 gives v101): it goes into the name of the download.
      - name: Read the version
        id: version
        shell: bash
        run: echo "tag=v$(sed -n 's/.*kVersion = "\([0-9.]*\)".*/\1/p' src/Version.h | tr -d .)" >> "$GITHUB_OUTPUT"

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Collect the plugin folder
        shell: bash
        run: cmake --install build --config Release --prefix dist

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: TransitionFX-${{ matrix.name }}_${{ steps.version.outputs.tag }}
          path: dist

      # The tests come after the upload, so a failing test never hides the plugin.
      - name: Build the tests
        shell: bash
        run: |
          cmake -S . -B build-tests ${{ matrix.args }} -DCMAKE_BUILD_TYPE=Release -DTRANSITIONFX_TESTS=ON
          cmake --build build-tests --config Release

      - name: Run the tests
        shell: bash
        run: ctest --test-dir build-tests -C Release --output-on-failure

  # One TransitionFX folder with the plugin for every platform: plugin.cfg names them all, and
  # the editor loads the one for the computer it runs on.
  package:
    name: all platforms
    needs: build
    # Also when one platform failed (a runner that is down, say): the folder then holds the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "tag=v$(sed -n 's/.*kVersion = "\([0-9.]*\)".*/\1/p' src/Version.h | tr -d .)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: TransitionFX-*
          path: all
          merge-multiple: true

      - name: Show what is in the folder
        run: find all -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: TransitionFX-all-platforms_${{ steps.version.outputs.tag }}
          path: all
